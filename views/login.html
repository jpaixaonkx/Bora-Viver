<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bora Viver Viagens</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Força a aplicação do gradiente moderno diretamente na página */
        html, body {
            background: linear-gradient(135deg, #2b5876 0%, #4e4376 50%, #eef2f3 100%) !important;
            background-attachment: fixed !important;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-logo-box">
                <img src="../public/assets/images/logo.png" alt="Bora Viver Viagens">
            </div>

            <div class="auth-header">
                <h2>Bem-vindo de <span class="highlight-text">Volta</span></h2>
                <p>Acesse sua conta para gerenciar suas reservas em tempo real.</p>
            </div>

            <div id="error-message" style="display: none; color: #ff4d4d; background: rgba(255,77,77,0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"></div>

            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-submit-login" class="btn-auth-action btn-login">
                    <span class="btn-text">Entrar</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
            </div>

            <a href="../index.html" class="back-to-home">
                <i class="fa-solid fa-arrow-left-long"></i> Voltar para a página inicial
            </a>
        </div>
    </div>

    <script>
    // Credenciais de conexão
    const SUPABASE_URL = "https://uwslswyfgldimziklonb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_PY98ZRigGjq79YtgiVjMUA_TXOiVhan"; 
    
    // Inicialização unificada e segura para CDN
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function executarLogin(event) {
        // ESSA LINHA TEM QUE SER A PRIMEIRA, para impedir a página de atualizar se algo falhar abaixo
        event.preventDefault(); 

        const emailInput = document.getElementById('email') || document.getElementById('login-email');
        const passwordInput = document.getElementById('password') || document.getElementById('login-senha');
        const msgErro = document.getElementById('error-message') || document.getElementById('mensagem-status');
        const btnSubmit = document.getElementById('btn-submit-login');

        if (msgErro) msgErro.style.display = 'none';
        
        if (!emailInput || !passwordInput) {
            alert("Erro interno: Campos do formulário não foram encontrados no HTML.");
            return;
        }

        if (btnSubmit) {
            btnSubmit.disabled = true;
            const btnText = btnSubmit.querySelector('.btn-text') || btnSubmit;
            btnText.innerText = "Autenticando...";
        }

        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: emailInput.value.trim(),
                password: passwordInput.value
            });

            if (error) throw error;

            if (typeof decolarAviao === "function") {
                decolarAviao();
            }

            setTimeout(() => {
                if (data.user.email === "BoraViver@gmail.com") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "cliente.html";
                }
            }, 850);

        } catch (err) {
            console.error("Erro capturado no Login:", err);
            
            if (btnSubmit) {
                btnSubmit.disabled = false;
                const btnText = btnSubmit.querySelector('.btn-text') || btnSubmit;
                btnText.innerText = "Entrar";
            }
            
            if (msgErro) {
                msgErro.innerText = err.message === "Invalid login credentials" 
                    ? "E-mail ou senha incorretos. Tente novamente." 
                    : err.message;
                msgErro.style.display = 'block';
            } else {
                alert("Erro ao entrar: " + err.message);
            }
        }
    }

    // Vinculação segura que funciona com qualquer ID de formulário que você colocou
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('login-form') || document.querySelector('.auth-form');
        if (form) {
            form.addEventListener('submit', executarLogin);
        }
    });
</script>
</body>
</html>
